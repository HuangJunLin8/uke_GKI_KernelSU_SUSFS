name: 下载内核源码

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: Android Version
        required: true
        default: "android14"
      
      kernel_version:
        description: Kernel Version
        required: true
        default: "6.1"
      
      os_patch_level:
        description: OS Patch Level
        required: true
        default: "2025-01"

env:
  KERNEL_ROOT: ${{ github.workspace }}/kernel_source

jobs:
  fetch-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
    
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl repo
    
      - name: Prepare Environment
        run: |
          mkdir -p "$KERNEL_ROOT"
    
          BUILD_TIME=$(date '+%Y-%m-%d_%H-%M-%S')
    
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
    
      - name: Initialize Kernel Repo
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          FORMATTED_BRANCH="${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.os_patch_level }}"
    
          echo "初始化 repo，分支: common-${FORMATTED_BRANCH}"
    
          repo init \
            --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-${FORMATTED_BRANCH} \
            --repo-rev=v2.16
    
          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
    
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
    
          if grep -q deprecated <<< "$REMOTE_BRANCH"; then
            echo "检测到已弃用的分支: ${FORMATTED_BRANCH}"
    
            sed -i \
              "s|\"${FORMATTED_BRANCH}\"|\"deprecated/${FORMATTED_BRANCH}\"|g" \
              "$DEFAULT_MANIFEST_PATH"
          fi
    
      - name: Sync Kernel Source
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          repo sync \
            -c \
            -j$(nproc) \
            --no-tags \
            --fail-fast
    
      - name: Record Source Information
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          echo "Branch:" > SOURCE_INFO.txt
          echo "${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.os_patch_level }}" >> SOURCE_INFO.txt
          echo "" >> SOURCE_INFO.txt
    
          echo "Common Commit:" >> SOURCE_INFO.txt
          git -C common rev-parse HEAD >> SOURCE_INFO.txt
    
          echo "" >> SOURCE_INFO.txt
          echo "Build Time:" >> SOURCE_INFO.txt
          date >> SOURCE_INFO.txt
    
          cat SOURCE_INFO.txt
    
      - name: Remove Git Metadata
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          echo "Removing .git directories..."
    
          find . \
            -type d \
            -name ".git" \
            -exec rm -rf {} +
    
          rm -rf .repo
    
      - name: Create Source Archive
        working-directory: ${{ github.workspace }}
        run: |
          TAR_NAME="kernel_source_${{ github.event.inputs.android_version }}_${{ github.event.inputs.kernel_version }}_${{ github.event.inputs.os_patch_level }}_${BUILD_TIME}.tar.gz"
    
          tar \
            -czf "$TAR_NAME" \
            kernel_source
    
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV
    
          ls -lh "$TAR_NAME"
    
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_source
          path: ${{ github.workspace }}/${{ env.TAR_NAME }}
          retention-days: 30
